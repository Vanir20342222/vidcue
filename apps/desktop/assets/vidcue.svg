<?xml version="1.0" encoding="UTF-8"?>
<!--
  The Vidcue desktop icon: the Android launcher mark - an open amber-to-pink arc
  around a white play triangle on the same near-black ground.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="arc" x1="106" y1="106" x2="406" y2="406" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF4D8D"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#14111A"/>
  <path d="M370.9 159.6 A150 150 0 1 0 370.9 352.4" fill="none" stroke="url(#arc)"
        stroke-width="46" stroke-linecap="round"/>
  <path d="M220 198 L322 256 L220 314 Z" fill="#FFFFFF" stroke="#FFFFFF"
        stroke-width="26" stroke-linejoin="round"/>
</svg>
