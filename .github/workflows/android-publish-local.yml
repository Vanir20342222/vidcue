name: Export qualified Android native inputs
on: create
permissions:
  contents: read
  actions: read
jobs:
  export:
    if: github.repository == 'Vanir20342222/ytui' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'native-export-beta1-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require the qualified main Android build
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 60; attempt++) {
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: 41925468337});
              if (run.head_sha !== '042fd66b2c1c716c3d8b2c493376e5ae7e34cc59' || run.head_branch !== 'main' || run.event !== 'push') throw new Error('Wrong source run');
              if (run.status === 'completed') { if (run.conclusion !== 'success') throw new Error('Source build failed'); return; }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Source build is not complete');
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41925468337
          name: vidcue-android-042fd66b2c1c716c3d8b2c493376e5ae7e34cc59
          path: tested
      - name: Split the exact tested APK into native packaging inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re,zipfile
          source='042fd66b2c1c716c3d8b2c493376e5ae7e34cc59'
          apks=list(Path('tested').rglob('app-debug.apk'))
          assert len(apks)==1
          apk=apks[0]
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          with zipfile.ZipFile(apk) as archive:
              assert any(source.encode() in archive.read(n) for n in archive.namelist() if re.fullmatch(r'classes[0-9]*\.dex',n))
              for abi in ('arm64-v8a','x86_64'):
                  directory=Path('export')/abi;directory.mkdir(parents=True)
                  data=archive.read('lib/'+abi+'/libvidcue_mobile.so')
                  (directory/'libvidcue_mobile.so').write_bytes(data)
                  (directory/'provenance.json').write_text(json.dumps(dict(source=source,run=41925468337,apk_sha256=digest,abi=abi,native_sha256=hashlib.sha256(data).hexdigest())))
              assets=Path('export/assets');assets.mkdir(parents=True)
              for name in archive.namelist():
                  if name.startswith('assets/notices/') or name=='assets/vidcue-LICENSE':
                      relative=Path(name).relative_to('assets');assert '..' not in relative.parts
                      if not name.endswith('/'):
                          target=assets/relative;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(archive.read(name))
              assert (assets/'notices/inventory.json').is_file()
              (assets/'provenance.json').write_text(json.dumps(dict(source=source,run=41925468337,apk_sha256=digest)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-native-arm64-042fd66
          path: export/arm64-v8a/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-native-x86-042fd66
          path: export/x86_64/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-android-assets-042fd66
          path: export/assets/
          retention-days: 1
      - name: Delete only this temporary export branch
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.ref;
            if (!/^native-export-beta1-[a-z0-9-]+$/.test(branch)) return;
            try { await github.rest.git.deleteRef({...context.repo, ref: `heads/${branch}`}); } catch (e) { if (e.status !== 404) throw e; }
