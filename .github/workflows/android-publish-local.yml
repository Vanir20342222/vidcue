name: Publish locally signed Android APK
on:
  create:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Temporary HTTPS file-service URL of the already signed APK (never a key/archive)'
        required: true
        type: string
      sha256:
        description: 'SHA256 of that APK'
        required: true
        type: string
      version_code:
        description: 'Expected Android version code'
        required: true
        type: string
      version_name:
        description: 'Expected version name'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: android-local-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Vanir20342222/ytui' && (github.ref == 'refs/heads/main' || (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'publish-android-')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      YTUI_APK_SHA256: ${{ inputs.sha256 }}
      YTUI_VERSION_CODE: ${{ inputs.version_code }}
      YTUI_VERSION_NAME: ${{ inputs.version_name }}
      YTUI_RELEASE_SOURCE: ${{ github.sha }}
    steps:
      - name: Mask the temporary transfer link before any environment logging
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'workflow_dispatch') return;
            const fs = require('fs');
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
            core.setSecret(event.inputs.apk_url);
            core.exportVariable('YTUI_APK_URL', event.inputs.apk_url);
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load the temporary APK handoff (keys are never transferred)
        if: github.event_name == 'create'
        env:
          HANDOFF_BRANCH: ${{ github.event.ref }}
        run: |
          python3 tools/android/publish_request.py read-branch "$HANDOFF_BRANCH"
      - name: Use the verified source checkout
        if: github.event_name == 'create'
        run: git checkout --detach "$YTUI_RELEASE_SOURCE"
      - name: Require successful exact-source main checks
        run: |
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" == "$YTUI_RELEASE_SOURCE" ]] ||
            { echo 'Main moved; qualify and sign the current main revision.' >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$YTUI_RELEASE_SOURCE&per_page=100" > "$RUNNER_TEMP/checks.json"
          python3 - <<'PY'
          import json, os, pathlib
          runs = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'checks.json').read_text())['workflow_runs']
          passed = {r['name'] for r in runs if r['head_sha'] == os.environ['YTUI_RELEASE_SOURCE'] and r['head_branch'] == 'main' and r['event'] == 'push' and r['status'] == 'completed' and r['conclusion'] == 'success'}
          missing = {'Android', 'Rust', 'Secret scan'} - passed
          if missing:
              raise SystemExit('Wait for successful main checks: ' + ', '.join(sorted(missing)))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned inspection tools
        run: sdkmanager 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: List published releases (version codes must keep increasing)
        run: gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
      - name: Download, verify and inspect the signed APK
        run: |
          export YTUI_PUBLISHED_RELEASES="$RUNNER_TEMP/releases.json"
          python3 tools/android/verify-local-release.py
          apk="publish/vidcue-$YTUI_VERSION_NAME.apk"
          tools/android/inspect-apk.sh "$apk" >> publish/APK-inspection.txt
      - name: Publish the verified APK without rebuilding or signing
        run: |
          tag="android-$YTUI_VERSION_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'A release already exists for this version; use an increasing version.' >&2
            exit 1
          fi
          gh release create "$tag" publish/*.apk publish/SHA256SUMS.txt publish/APK-inspection.txt --repo "$GITHUB_REPOSITORY" --target "$YTUI_RELEASE_SOURCE" --title "Vidcue Android $YTUI_VERSION_NAME" --notes-file publish/notes.md --draft --prerelease --latest=false
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - name: Remove the temporary handoff branch
        if: always() && github.event_name == 'create'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.ref;
            if (!/^publish-android-[A-Za-z0-9.+_-]+-[0-9a-f]{12}$/.test(branch)) return;
            try {
              await github.rest.git.deleteRef({...context.repo, ref: `heads/${branch}`});
            } catch (error) {
              if (error.status !== 404) throw error;
            }
