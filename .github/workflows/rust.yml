name: Rust
on:
  # Branch pushes are covered by pull_request; running both doubled the work for fix/** branches.
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
  # Debug info is never inspected in CI; dropping it shrinks builds and caches.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  changes:
    name: Which checks apply
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        run: echo "run=$(tools/ci/should-run.sh rust)" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      # glib/gtk/webkit build scripts query pkg-config even for clippy.
      - name: Install the desktop app's build libraries
        timeout-minutes: 10
        run: bash tools/ci-install-media.sh libmpv-dev libxkbcommon-dev libwebkit2gtk-4.1-dev
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the desktop app's link libraries
        timeout-minutes: 10
        run: bash tools/ci-install-media.sh libmpv-dev libxkbcommon-dev libwebkit2gtk-4.1-dev
      - run: cargo test --workspace --locked
      - name: Verify mobile direct-player request budgets and fallback offline
        env:
          CARGO_TARGET_DIR: target
        run: cargo test --manifest-path vendor/yt-dlp-rs/Cargo.toml --locked --test mobile_playback
      - name: Verify CI media setup deadlines and mirror recovery offline
        run: bash tools/test-ci-install-media.sh
      - name: Verify native YouTube JavaScript solver with saved player vectors
        run: tools/test-native-solver.sh
  media:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: media
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install real-media fixture tools
        timeout-minutes: 10
        run: bash tools/ci-install-media.sh ffmpeg lua5.4 mpv
      - name: Install pinned yt-dlp for local-media integration checks
        timeout-minutes: 4
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 60 https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.21/yt-dlp_linux --output "$RUNNER_TEMP/yt-dlp"
          chmod +x "$RUNNER_TEMP/yt-dlp"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check mpv window menu with a synthetic API
        run: lua5.4 crates/vidcue-services/tests/player_menu.lua
      - name: Verify native cuts, chapters and splitting with FFmpeg
        env:
          NO_PROXY: 127.0.0.1,localhost
        run: cargo test -p vidcue-services --locked real_ffmpeg_ -- --ignored
      - name: Verify MPRIS on an isolated D-Bus session
        run: dbus-run-session -- cargo test -p vidcue-services --locked live_desktop_mpris -- --ignored
      - name: Verify actual mpv external-extraction handoff
        env:
          NO_PROXY: 127.0.0.1,localhost
        run: cargo test -p vidcue-services --locked real_mpv_external_playback_ -- --ignored
      - name: Verify native HLS manifest and request identity in mpv
        run: cargo test -p vidcue-services --locked real_mpv_native_hls_ -- --ignored
      - name: Verify audio-reactive meters and live style changes with actual mpv
        run: cargo test -p vidcue-services --locked real_mpv_audio_meter -- --ignored
      - name: Verify live reconnect controls with actual mpv and loopback HTTP
        env:
          NO_PROXY: 127.0.0.1,localhost
        run: cargo test -p vidcue-services --locked real_mpv_stream_reconnect -- --ignored
      - name: Verify actual mpv HTTP proxy routing
        run: cargo test -p vidcue-services --locked real_mpv_http_proxy_ -- --ignored
  release-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the desktop app's link libraries
        timeout-minutes: 10
        run: bash tools/ci-install-media.sh libmpv-dev libxkbcommon-dev libwebkit2gtk-4.1-dev
      - run: cargo build --release --locked

  # The single required check for branch rulesets and the merge queue (see android.yml).
  # release-build only runs on pushes to main and is not part of the gate.
  gate:
    name: Rust gate
    needs: [changes, lint, test, media]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every Rust job to have passed or been skipped on purpose
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in *' failure '*|*' cancelled '*) exit 1;; esac
