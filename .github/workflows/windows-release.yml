# Builds the Windows desktop release when a `desktop-*` tag is pushed and attaches the
# installer and a portable zip to that GitHub release.
#
# The x86_64-pc-windows-gnu target links the bundled libmpv: the workflow downloads the
# current mpv-dev package (zhongfly/mpv-winbuild), points MPV_LIB_DIR at its import
# library (`-lmpv-2`, see apps/desktop/build.rs) and ships `libmpv-2.dll` beside the exe.
name: windows-release

on:
  push:
    tags: ["desktop-*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out the tagged tree
        uses: actions/checkout@v4

      - name: Set up the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-gnu
          # The action defaults to `-D warnings`. Unix-only helpers in the shared crates leave
          # unused-variable warnings on Windows; lint gating happens in the Rust workflow.
          rustflags: ""

      - name: Install the mingw-w64 C toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Put the mingw compiler on PATH
        shell: pwsh
        run: |
          $bin = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "mingw64\bin"
          if (-not (Test-Path "$bin\gcc.exe")) { throw "mingw gcc missing in $bin" }
          Add-Content $env:GITHUB_PATH $bin
          Add-Content $env:GITHUB_ENV "CC_x86_64_pc_windows_gnu=$bin\gcc.exe"
          Add-Content $env:GITHUB_ENV "AR_x86_64_pc_windows_gnu=$bin\ar.exe"

      - name: Download and unpack the mpv dev package
        id: mpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Baseline x86_64 build (not the -v3 or -lgpl variants) of the latest release.
          gh release download --repo zhongfly/mpv-winbuild --pattern "mpv-dev-x86_64-[0-9]*" -O mpv-dev.7z
          if ($LASTEXITCODE -ne 0) { throw "cannot download the mpv-dev-x86_64 package" }
          7z x -y mpv-dev.7z -ompv-dev | Out-Null
          $dll = Get-ChildItem -Recurse ompv-dev -Filter libmpv-2.dll | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll missing from the mpv-dev package" }
          $libdir = "mpv\lib"
          New-Item -ItemType Directory -Force $libdir | Out-Null
          Copy-Item $dll.FullName "$libdir\libmpv-2.dll"
          $import = Get-ChildItem -Recurse ompv-dev -Include *.dll.a,*.a -ErrorAction SilentlyContinue |
            Where-Object Name -like "libmpv*" | Select-Object -First 1
          if ($import) { Copy-Item $import.FullName "$libdir\libmpv-2.dll.a" }
          Add-Content $env:GITHUB_ENV "MPV_LIB_DIR=$((Resolve-Path $libdir).Path)"

      - name: Build the release binary
        shell: pwsh
        run: cargo build --release --locked --target x86_64-pc-windows-gnu -p vidcue-desktop

      - name: Assemble the distribution folder
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item target\x86_64-pc-windows-gnu\release\vidcue-desktop.exe "$dist\vidcue.exe"
          Copy-Item mpv\lib\libmpv-2.dll $dist
          # The updater never ships third-party tools; users who want yt-dlp or FFmpeg
          # downloads put them (or their paths) in Vidcue's settings themselves.
          "Vidcue $env:VERSION for Windows (64-bit).`n`nRun vidcue.exe. libmpv-2.dll must sit beside it (included).`nOptional yt-dlp and FFmpeg are not bundled; install them yourself and point Vidcue at them in Settings.`n" |
            Set-Content "$dist\README.txt"
          Add-Content $env:GITHUB_ENV "DIST=$dist"

      - name: Build the installer
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $version = $env:VERSION -replace '^desktop-v?',''
          $numeric = ($version -split '[-+]')[0]
          & $iscc "/DAppVersion=$version" "/DFileVersion=$numeric" tools\windows\vidcue.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Zip the portable build
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath Vidcue-portable.zip

      - name: Attach the artifacts to the release
        if: startsWith(github.ref, 'refs/tags/desktop-')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            installer/VidcueSetup-*.exe Vidcue-portable.zip --clobber --repo "$GITHUB_REPOSITORY"
